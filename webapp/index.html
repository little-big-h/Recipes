<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family Recipes</title>
<meta name="description" content="Browse the family recipe collection on iPhone and iPad.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- iOS home-screen / standalone app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recipes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D96C3F">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"></div>

<template id="tpl-shell">
  <div class="app-header" id="app-header">
    <div class="nav-row">
      <button id="back-btn" class="icon-btn nav-back" aria-label="Back to recipes" hidden>‹</button>
      <h1 id="nav-title">🍽️ Family Recipes</h1>
      <div class="nav-actions">
        <button id="more-btn" class="icon-btn" aria-label="More actions" hidden>•••</button>
        <button id="lock-btn" class="icon-btn" aria-label="Lock app">🔒</button>
      </div>
    </div>

    <div class="search-row" id="search-row">
      <div class="search-wrap">
        <input id="search-input" type="search" placeholder="Search recipes or ingredients"
               autocapitalize="off" autocorrect="off" enterkeyhint="search">
      </div>
      <select id="sort-select" aria-label="Sort recipes">
        <option value="newest">Newest</option>
        <option value="az">A–Z</option>
      </select>
    </div>

    <nav class="chips" id="category-chips" aria-label="Filter by category"></nav>
  </div>

  <div id="ptr-indicator" class="ptr-indicator" aria-hidden="true">
    <span class="ptr-arrow">↓</span>
    <span class="ptr-spinner"></span>
    <span class="ptr-label">Pull to refresh</span>
  </div>

  <main id="recipe-list" class="recipe-list"></main>
  <p class="empty-state" id="empty-state" hidden>No recipes match — try a different search or category.</p>

  <section id="recipe-detail" class="recipe-detail" hidden>
    <article id="recipe-content" class="recipe-content"></article>
  </section>

  <div id="more-menu" class="more-menu" hidden>
    <div class="more-menu-backdrop" id="more-menu-backdrop"></div>
    <div class="more-menu-sheet">
      <a id="menu-foodnoms" class="more-menu-item" href="#" target="_blank" rel="noopener" hidden>⬇︎ Download FoodNoms</a>
      <button type="button" id="menu-fav" class="more-menu-item">☆ Add to Favorites</button>
      <button type="button" id="menu-share" class="more-menu-item">⤴︎ Share Recipe</button>
      <button type="button" id="menu-cancel" class="more-menu-item cancel">Cancel</button>
    </div>
  </div>
</template>

<script type="module" src="js/app.js"></script>
</body>
</html>
